name: Portable Windows EXE

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload portable EXE (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: steeldart-counter-win-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Windows Portable (aktuell)
          body: |
            Aktuelle portable Windows-App (ohne Installer). Wird bei jedem Push auf `master` ersetzt.

            Commit: `${{ github.sha }}`
          files: release/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          target_commitish: ${{ github.sha }}
