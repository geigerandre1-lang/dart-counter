name: Portable Windows EXE

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: steeldart-counter-win-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
